<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3a7bf0"/>
      <stop offset="0.55" stop-color="#2551b8"/>
      <stop offset="1" stop-color="#16306f"/>
    </linearGradient>
    <radialGradient id="glanz" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff8f6b"/>
    </linearGradient>
    <linearGradient id="berg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6fd6"/>
      <stop offset="1" stop-color="#22428f"/>
    </linearGradient>
    <linearGradient id="berg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b8ff0"/>
      <stop offset="1" stop-color="#3561c4"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="schatten" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06163d" flood-opacity="0.45"/>
    </filter>
    <filter id="schattenK" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06163d" flood-opacity="0.35"/>
    </filter>
    <clipPath id="foto"><rect x="0" y="0" width="420" height="330" rx="22"/></clipPath>
  </defs>

  <!-- macOS-Grundform -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glanz)"/>

  <!-- hinteres Foto -->
  <g transform="translate(250 230) rotate(-9)" filter="url(#schattenK)">
    <rect x="-16" y="-16" width="452" height="362" rx="30" fill="#e9eefb"/>
    <rect x="0" y="0" width="420" height="330" rx="22" fill="#9fb8ee"/>
  </g>

  <!-- vorderes Foto -->
  <g transform="translate(232 290) rotate(4)" filter="url(#schatten)">
    <rect x="-18" y="-18" width="456" height="366" rx="32" fill="#ffffff"/>
    <g clip-path="url(#foto)">
      <rect width="420" height="330" fill="url(#himmel)"/>
      <circle cx="300" cy="105" r="46" fill="#fff4d6"/>
      <path d="M-10 330 L120 150 L205 255 L270 190 L430 330 Z" fill="url(#berg2)"/>
      <path d="M-10 330 L70 250 L150 310 L250 225 L430 330 Z" fill="url(#berg1)"/>
    </g>
  </g>

  <!-- Lupe -->
  <g filter="url(#schatten)">
    <line x1="742" y1="742" x2="842" y2="842" stroke="#ffffff" stroke-width="74" stroke-linecap="round"/>
    <circle cx="640" cy="640" r="150" fill="url(#glas)" stroke="#ffffff" stroke-width="44"/>
  </g>

  <!-- KI-Funke in der Lupe -->
  <path d="M640 568 C648 615 665 632 712 640 C665 648 648 665 640 712 C632 665 615 648 568 640 C615 632 632 615 640 568 Z"
        fill="#ffffff"/>
  <path d="M700 585 C703 598 707 602 720 605 C707 608 703 612 700 625 C697 612 693 608 680 605 C693 602 697 598 700 585 Z"
        fill="#ffffff" opacity="0.85"/>
</svg>
